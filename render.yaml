services:
  - type: web
    name: construction-location-backend
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: construction-location-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: LOCATION_UPDATE_INTERVAL
        value: '20000'
      - key: LOCATION_DISTANCE_INTERVAL
        value: '20'
      - key: LIVE_LOCATION_TIMEOUT
        value: '60'
      - key: STALE_LOCATION_TIMEOUT
        value: '300'
      - key: OFFLINE_LOCATION_TIMEOUT
        value: '600'

databases:
  - name: construction-location-db
    plan: free
    postgresMajorVersion: 16
